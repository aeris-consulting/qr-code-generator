version: 2
project_name: qrgen

builds:
  - id: qrgen
    main: ./cmd/qrgen
    binary: qrgen
    env: [CGO_ENABLED=0] # pure Go: every target cross-compiles from one runner
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ignore:
      - { goos: windows, goarch: arm64 }
      - { goos: darwin, goarch: amd64 }

archives:
  - formats: [tar.gz]
    format_overrides:
      - { goos: windows, formats: [zip] }
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
